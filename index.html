<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Way to California 🌴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #2d1b4e 0%, #a03a5c 45%, #e8590c 80%, #f7b32b 110%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    color: #fff;
  }
  .box { max-width: 760px; width: 100%; text-align: center; }
  h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: .01em; }
  .sub { margin-top: 12px; font-size: 16px; color: rgba(255,255,255,.85); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 40px; }
  a.card {
    display: block; text-decoration: none; color: #2b2018;
    background: rgba(255,255,255,.96);
    border-radius: 18px; padding: 28px 24px; text-align: left;
    box-shadow: 0 12px 36px rgba(0,0,0,.22);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 18px 44px rgba(0,0,0,.28); }
  .card .emoji { font-size: 34px; }
  .card h2 { font-size: 19px; margin-top: 12px; }
  .card p { font-size: 13.5px; color: #6f6257; margin-top: 6px; line-height: 1.6; }
  .card .go { display: inline-block; margin-top: 14px; font-size: 13.5px; font-weight: 600; color: #e8590c; }
  .foot { margin-top: 36px; font-size: 12.5px; color: rgba(255,255,255,.65); }
</style>
</head>
<body>
  <div class="box">
    <h1>One Way to California 🌴</h1>
    <div class="sub">J-1 学生赴美两件大事：签下来，然后收拾行李。</div>
    <div class="cards">
      <a class="card" href="visa/">
        <div class="emoji">🛂</div>
        <h2>J-1 美签材料自查清单</h2>
        <p>27 项面签材料逐项核对：DS-2019、SEVIS、DS-160、MRV 收据……每项都标注去哪获取、长什么样。</p>
        <span class="go">开始自查 →</span>
      </a>
      <a class="card" href="packing/">
        <div class="emoji">🧳</div>
        <h2>南加州行前准备清单</h2>
        <p>9–12 月气候速览 + 电话卡怎么办、被子电饭锅带不带、海关红线，落地两周任务清单。</p>
        <span class="go">开始准备 →</span>
      </a>
    </div>
    <div class="foot">进度保存在浏览器本地 · 仅供个人参考，官方要求以使领馆为准</div>
  </div>
</body>
</html>
